<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - ShopEasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <h2>Admin Panel</h2>
    <div id="msg" class="msg"></div>

    <div id="stats" class="grid"></div>

    <h3>Products</h3>
    <form id="productForm" class="box" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px;">
      <input type="hidden" id="p_id">
      <select id="p_category" required></select>
      <input id="p_name" placeholder="Product name" required>
      <input id="p_price" type="number" step="0.01" min="0" placeholder="Price" required>
      <input id="p_stock" type="number" min="0" placeholder="Stock" required>
      <input id="p_image" placeholder="Image URL">
      <input id="p_desc" placeholder="Description">
      <button class="btn" type="submit" id="p_save">Add Product</button>
      <button class="btn" type="button" id="p_cancel" style="background:#6b7280; display:none;">Cancel</button>
    </form>
    <div class="table-wrap"><table id="productTable"></table></div>

    <h3>Categories</h3>
    <form id="categoryForm" class="box" style="display:flex; gap:10px; flex-wrap:wrap;">
      <input id="c_name" placeholder="New category name" required>
      <button class="btn" type="submit">Add Category</button>
    </form>
    <div class="table-wrap"><table id="categoryTable"></table></div>

    <h3>All Orders</h3>
    <div class="table-wrap"><table id="orderTable"></table></div>
  </div>

  <script src="api.js"></script>
  <script>
    renderNav();
    const me = getUser();
    // Sirf admin hi is page par aa sakta hai
    if (!getToken() || !me || me.role !== 'admin') window.location = '/index.html';

    let categories = [];
    let products = [];
    const STATUSES = ['pending', 'shipped', 'delivered', 'cancelled'];

    // ---------- Dashboard ----------
    async function loadStats() {
      const s = await api('/admin/stats');
      const card = (label, value) =>
        `<div class="card"><span class="muted">${label}</span><b style="font-size:24px">${value}</b></div>`;
      document.getElementById('stats').innerHTML =
        card('Products', s.total_products) + card('Orders', s.total_orders) +
        card('Customers', s.total_customers) + card('Total Sales', '₹' + s.total_sales);
    }

    // ---------- Categories ----------
    async function loadCategories() {
      categories = await api('/categories');
      document.getElementById('p_category').innerHTML =
        categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      document.getElementById('categoryTable').innerHTML =
        '<tr><th>ID</th><th>Name</th><th></th></tr>' +
        categories.map(c => `
          <tr><td>${c.id}</td><td>${escapeHtml(c.name)}</td>
          <td><button data-action="c-rename" data-id="${c.id}">Rename</button>
              <button data-action="c-delete" data-id="${c.id}">Delete</button></td></tr>`).join('');
    }

    // ---------- Products ----------
    async function loadProducts() {
      products = await api('/products');
      document.getElementById('productTable').innerHTML =
        '<tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>' +
        products.map(p => `
          <tr><td>${p.id}</td><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.category_name)}</td>
          <td>₹${p.price}</td>
          <td style="${p.stock < 5 ? 'color:#dc2626;font-weight:bold' : ''}">${p.stock}</td>
          <td><button data-action="p-edit" data-id="${p.id}">Edit</button>
              <button data-action="p-delete" data-id="${p.id}">Delete</button></td></tr>`).join('');
    }

    function resetProductForm() {
      document.getElementById('productForm').reset();
      document.getElementById('p_id').value = '';
      document.getElementById('p_save').textContent = 'Add Product';
      document.getElementById('p_cancel').style.display = 'none';
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('p_id').value;
      const body = JSON.stringify({
        category_id: Number(document.getElementById('p_category').value),
        name: document.getElementById('p_name').value.trim(),
        price: Number(document.getElementById('p_price').value),
        stock: Number(document.getElementById('p_stock').value),
        image_url: document.getElementById('p_image').value.trim(),
        description: document.getElementById('p_desc').value.trim()
      });
      try {
        await api(id ? '/products/' + id : '/products', { method: id ? 'PUT' : 'POST', body });
        showMessage(id ? 'Product updated' : 'Product added', 'ok');
        resetProductForm();
        loadProducts(); loadStats();
      } catch (err) { showMessage(err.message, 'err'); }
    });

    document.getElementById('p_cancel').addEventListener('click', resetProductForm);

    // ---------- Orders ----------
    async function loadOrders() {
      const orders = await api('/admin/orders');
      document.getElementById('orderTable').innerHTML =
        '<tr><th>ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr>' +
        orders.map(o => `
          <tr><td>#${o.id}</td><td>${escapeHtml(o.customer_name)}</td>
          <td>${new Date(o.created_at + 'Z').toLocaleString('en-IN')}</td>
          <td>₹${o.total_amount}</td>
          <td><select data-order="${o.id}">
            ${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select></td></tr>`).join('');
    }

    document.getElementById('orderTable').addEventListener('change', async (e) => {
      if (!e.target.dataset.order) return;
      try {
        await api('/admin/orders/' + e.target.dataset.order + '/status',
          { method: 'PATCH', body: JSON.stringify({ status: e.target.value }) });
        showMessage('Order status updated', 'ok');
      } catch (err) { showMessage(err.message, 'err'); }
    });

    // ---------- Button clicks (Edit / Delete / Rename) ----------
    document.body.addEventListener('click', async (e) => {
      const action = e.target.dataset.action;
      const id = e.target.dataset.id;
      if (!action) return;
      try {
        if (action === 'p-edit') {
          const p = products.find(x => x.id == id);
          document.getElementById('p_id').value = p.id;
          document.getElementById('p_category').value = p.category_id;
          document.getElementById('p_name').value = p.name;
          document.getElementById('p_price').value = p.price;
          document.getElementById('p_stock').value = p.stock;
          document.getElementById('p_image').value = p.image_url || '';
          document.getElementById('p_desc').value = p.description || '';
          document.getElementById('p_save').textContent = 'Update Product';
          document.getElementById('p_cancel').style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'p-delete') {
          if (!confirm('Delete this product?')) return;
          await api('/products/' + id, { method: 'DELETE' });
          showMessage('Product deleted', 'ok');
          loadProducts(); loadStats();
        } else if (action === 'c-rename') {
          const name = prompt('New category name:');
          if (!name) return;
          await api('/categories/' + id, { method: 'PUT', body: JSON.stringify({ name }) });
          showMessage('Category renamed', 'ok');
          loadCategories(); loadProducts();
        } else if (action === 'c-delete') {
          if (!confirm('Delete this category?')) return;
          await api('/categories/' + id, { method: 'DELETE' });
          showMessage('Category deleted', 'ok');
          loadCategories();
        }
      } catch (err) { showMessage(err.message, 'err'); }
    });

    // ---------- Category add ----------
    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/categories', { method: 'POST', body: JSON.stringify({ name: document.getElementById('c_name').value.trim() }) });
        showMessage('Category added', 'ok');
        e.target.reset();
        loadCategories();
      } catch (err) { showMessage(err.message, 'err'); }
    });

    loadStats(); loadCategories(); loadProducts(); loadOrders();
  </script>
</body>
</html>
