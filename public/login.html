<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - ShopEasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav"></nav>

  <div class="container" style="max-width: 420px;">
    <h2>Login</h2>
    <div id="msg" class="msg"></div>

    <form id="form" style="display: flex; flex-direction: column; gap: 12px;">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button class="btn" type="submit">Login</button>
    </form>
    <p>New here? <a href="register.html">Create an account</a></p>
  </div>

  <script src="api.js"></script>
  <script>
    renderNav();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        // Token aur user browser me save karo
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location = '/index.html';
      } catch (err) {
        showMessage(err.message, 'err');
      }
    });
  </script>
</body>
</html>
