<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav"></nav>

  <div class="container">
    <div id="msg" class="msg"></div>

    <div class="filters">
      <input id="search" placeholder="Search products...">
      <select id="category"><option value="">All categories</option></select>
      <button class="btn" id="searchBtn">Search</button>
    </div>

    <div id="products" class="grid"></div>
  </div>

  <script src="api.js"></script>
  <script>
    renderNav();

    async function loadCategories() {
      const cats = await api('/categories');
      const select = document.getElementById('category');
      cats.forEach(c => {
        select.innerHTML += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
      });
    }

    async function loadProducts() {
      const search = document.getElementById('search').value;
      const category = document.getElementById('category').value;
      const query = '?search=' + encodeURIComponent(search) + '&category=' + category;

      const products = await api('/products' + query);
      const box = document.getElementById('products');

      if (products.length === 0) {
        box.innerHTML = '<p>No products found.</p>';
        return;
      }
      box.innerHTML = products.map(p => `
        <div class="card">
          <img src="${escapeHtml(p.image_url)}" alt="">
          <b>${escapeHtml(p.name)}</b>
          <span class="muted">${escapeHtml(p.category_name)}</span>
          <span class="price">₹${p.price}</span>
          <span class="muted">${p.stock > 0 ? 'In stock' : 'Out of stock'}</span>
          <button class="btn add-btn" data-id="${p.id}" ${p.stock === 0 ? 'disabled' : ''}>Add to Cart</button>
        </div>`).join('');
    }

    // Add to Cart button
    document.getElementById('products').addEventListener('click', async (e) => {
      if (!e.target.classList.contains('add-btn')) return;
      if (!getToken()) { window.location = '/login.html'; return; }
      try {
        await api('/cart', {
          method: 'POST',
          body: JSON.stringify({ product_id: Number(e.target.dataset.id), quantity: 1 })
        });
        showMessage('Added to cart!', 'ok');
      } catch (err) {
        showMessage(err.message, 'err');
      }
    });

    document.getElementById('searchBtn').addEventListener('click', loadProducts);
    document.getElementById('category').addEventListener('change', loadProducts);

    loadCategories();
    loadProducts();
  </script>
</body>
</html>
